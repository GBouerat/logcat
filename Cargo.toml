[package]
name = "logcat-cli"
version = "0.1.0"
edition = "2021"
authors = ["Guillaume BOUERAT <GuillaumeBOUERAT@gmail.com>"]
description = "A modern, high-performance pidcat replacement in Rust for filtering and highlighting Android logcat"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/GBouerat/logcat"
homepage = "https://github.com/GBouerat/logcat"
keywords = ["android", "logcat", "adb", "pidcat", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github",
    "tests",
    "ARCHITECTURE.md",
]

[[bin]]
name = "logcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
terminal_size = "0.4"
anyhow = "1.0"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: logcat-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: logcat-x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: logcat-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_name: logcat-aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: logcat-x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release asset (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/logcat staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          cd staging
          tar -czf ../${{ matrix.archive_name }}.tar.gz *
          cd ..
          shasum -a 256 ${{ matrix.archive_name }}.tar.gz > ${{ matrix.archive_name }}.tar.gz.sha256

      - name: Package release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/logcat.exe staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          cd staging
          7z a ../${{ matrix.archive_name }}.zip *
          cd ..
          certutil -hashfile ${{ matrix.archive_name }}.zip SHA256 | grep -v "hash" | tr -d ' \r\n' > ${{ matrix.archive_name }}.zip.sha256.raw
          echo "$(cat ${{ matrix.archive_name }}.zip.sha256.raw)  ${{ matrix.archive_name }}.zip" > ${{ matrix.archive_name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: |
            logcat-*.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256 *.raw

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
